name: Daily Stock Report

on:
  # 每週一至五 18:00 台灣時間（= UTC 09:50），避開整點擁塞
  schedule:
    - cron: '50 9 * * 1-5'

  # 手動觸發（可在 GitHub Actions 頁面按 "Run workflow"）
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install CJK font and Playwright browsers
        run: |
          sudo apt-get install -y fonts-noto-cjk
          playwright install chromium --with-deps

      - name: Send stock report
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python send_report.py

      - name: Commit streak cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add streak_cache.json
          git diff --staged --quiet || git commit -m "chore: update streak cache [skip ci]"
          git push
